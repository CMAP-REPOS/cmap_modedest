[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cmap_modedest"
description = "Mode-destination choice submodel for CMAP trip-based travel demand model"
readme = "README.md"
requires-python = "~=3.9.15"
dependencies = [
  "cloudpickle~=2.0.0",
  "dask~=2021.12.0",
  "fiona~=1.8.22",
  "geopandas~=0.10.2",
  "joblib~=1.1.1",
  "larch~=5.5.9",
  "matplotlib~=3.5.3",
  "numba~=0.53.0",
  "numexpr~=2.7.3",
  "numpy~=1.21.6",
  "pandas~=1.3.5",
  "psutil~=7.0.0",
  "pyarrow~=6.0.0",
  "tables~=3.7.0",
  "scipy~=1.7.3",
  "sharrow @ git+https://github.com/CMAP-REPOS/cmap_modedest#subdirectory=sharrow",
  "tbb4py~=2021.4.0",
  "xarray~=0.20.2",
  "zarr~=2.10.3"
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/CMAP-REPOS/cmap_modedest"

[project.scripts]
cmap_modedest = "cmap_modedest.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]